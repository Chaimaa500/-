<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شات النخبة - غرفة الدردشة</title>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: Tahoma, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1e293b; padding: 15px; text-align: center; border-bottom: 2px solid #334155; font-size: 20px; font-weight: bold; color: #38bdf8; }
        .chat-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 250px; background: #1e293b; border-left: 1px solid #334155; padding: 10px; overflow-y: auto; }
        .sidebar h3 { font-size: 16px; border-bottom: 1px solid #475569; padding-bottom: 5px; color: #cbd5e1; }
        .user-item { padding: 5px; font-size: 14px; margin-bottom: 5px; border-radius: 4px; background: #334155; }
        .owner { color: #ef4444; font-weight: bold; }
        .super-admin { color: #f59e0b; font-weight: bold; }
        .admin { color: #10b981; font-weight: bold; }
        .premium { color: #8b5cf6; font-weight: bold; }
        .chat-main { flex: 1; display: flex; flex-direction: column; padding: 10px; }
        .messages { flex: 1; background: #020617; border-radius: 8px; padding: 10px; overflow-y: auto; border: 1px solid #1e293b; margin-bottom: 10px; }
        .message { margin-bottom: 10px; background: #1e293b; padding: 8px; border-radius: 6px; }
        .msg-input-area { display: flex; gap: 10px; }
        input, button { padding: 10px; border-radius: 6px; border: none; font-size: 14px; }
        input { flex: 1; background: #1e293b; color: #fff; border: 1px solid #334155; }
        button { background: #0284c7; color: #fff; cursor: pointer; font-weight: bold; }
        button:hover { background: #0369a1; }
    </style>
</head>
<body>

    <header>🌟 شات النخبة التفاعلي 🌟</header>

    <div class="chat-container">
        <!-- شاشة الرسائل -->
        <div class="chat-main">
            <div class="messages" id="messagesBox">
                <div class="message"><span class="owner">[Owner] شيماء:</span> أهلاً بكم في شات النخبة! النظام يعمل بنجاح.</div>
            </div>
            <div class="msg-input-area">
                <input type="text" id="msgInput" placeholder="اكتب رسالتك هنا...">
                <button onclick="sendMessage()">إرسال</button>
            </div>
        </div>

        <!-- قائمة الأعضاء والرتب -->
        <div class="sidebar">
            <h3>المتواجدون</h3>
            <div class="user-item owner">👑 شيماء (Owner) [رتبة 100]</div>
            <div class="user-item super-admin">⭐ مشرف عام [رتبة 85]</div>
            <div class="user-item admin">🛡️ أدمن [رتبة 50]</div>
            <div class="user-item premium">💎 عضو بريميوم [رتبة 30]</div>
            <div class="user-item">👤 عضو عادي [رتبة 5]</div>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('msgInput');
            const box = document.getElementById('messagesBox');
            if(input.value.trim() !== "") {
                const msg = document.createElement('div');
                msg.className = 'message';
                msg.innerHTML = `<span class="premium">[رتبة 30] زائر:</span> ${input.value}`;
                box.appendChild(msg);
                input.value = "";
                box.scrollTop = box.scrollHeight;
            }
        }
    </script>
</body>
</html>

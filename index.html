<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arabi.Chat - شات النخبة</title>
    <style>
        :root {
            --bg-dark: #071019;
            --top-bar: #0b1320;
            --gold: #ffcc00;
            --border: #1e365c;
        }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-dark);
            color: #f1f5f9;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* الشريط العلوي */
        .top-header-bar {
            background-color: var(--top-bar);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 2px solid var(--border);
            font-size: 13px;
            font-weight: bold;
        }
        .room-indicator { color: var(--gold); cursor: pointer; display: flex; align-items: center; gap: 5px; }

        /* المحتوى الرئيسي */
        .main-chat-layout { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-dark); overflow: hidden; }
        
        /* التبديل بين العام والخاص */
        .chat-mode-tabs { display: flex; background: #111d2e; border-bottom: 1px solid var(--border); }
        .chat-mode-tab { flex: 1; text-align: center; padding: 8px; font-size: 12px; font-weight: bold; cursor: pointer; background: #0b1320; color: #94a3b8; border-left: 1px solid var(--border); }
        .chat-mode-tab.active { background: #1e365c; color: var(--gold); }

        .messages-box { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
        .message-row { background: rgba(30, 54, 92, 0.2); border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; position: relative; display: flex; justify-content: space-between; align-items: flex-start; }
        .private-msg { background: rgba(168, 85, 247, 0.15); border-color: #a855f7; }
        .delete-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 11px; font-weight: bold; }

        .input-area { background: #111d2e; padding: 10px; display: flex; gap: 8px; border-top: 1px solid var(--border); align-items: center; }
        .input-area input { flex: 1; background: #071019; border: 1px solid var(--border); padding: 9px 15px; border-radius: 20px; color: #fff; outline: none; font-size: 13px; }
        .send-btn { background: #0284c7; border: none; color: white; padding: 9px 18px; border-radius: 20px; cursor: pointer; font-weight: bold; }

        /* شريط التنقل السفلي */
        .bottom-nav-bar { background-color: var(--top-bar); display: flex; justify-content: space-around; align-items: center; padding: 8px 0; border-top: 2px solid var(--border); font-size: 11px; }
        .bottom-nav-item { cursor: pointer; color: #cbd5e1; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; }
        .bottom-nav-item:hover, .bottom-nav-item.active { color: var(--gold); }

        /* نافذة الملف الشخصي للمالك */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .profile-card { background: linear-gradient(to bottom, #111d2e, #071019); border: 2px solid var(--gold); width: 340px; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
        .profile-header-bg { background: #000; text-align: center; padding: 15px; border-bottom: 2px solid var(--gold); }
        .owner-crown-title { color: var(--gold); font-size: 18px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .profile-body { padding: 15px; font-size: 13px; display: flex; flex-direction: column; gap: 10px; }
        .profile-info-row { background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; }
        .admin-panel-box { background: #16263f; border: 1px solid #ef4444; padding: 10px; border-radius: 6px; }
        .close-modal { position: absolute; top: 10px; right: 10px; background: none; border: none; color: white; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <div class="top-header-bar">
        <div class="room-indicator" onclick="alert('تغيير الغرفة')">🏛️ <span id="currentRoomTitle">غرفة الجزائر</span></div>
        <div style="font-size: 12px; color: var(--gold);">👑 مالك الموقع</div>
    </div>

    <!-- المحتوى -->
    <div class="main-chat-layout">
        <div class="chat-area">
            <div class="chat-mode-tabs">
                <div id="tabPublic" class="chat-mode-tab active" onclick="switchChatMode('public')">🌐 العام</div>
                <div id="tabPrivate" class="chat-mode-tab" onclick="switchChatMode('private')">🔒 الخاص</div>
            </div>
            <div id="messagesBox" class="messages-box">
                <div class="message-row" id="msg-1">
                    <div><span style="color: #ef4444; font-weight: bold;">👑 شيماء [مالك]:</span> أهلاً بك في شاتك الخاص.</div>
                    <button class="delete-btn" onclick="deleteMessage('msg-1')">حذف</button>
                </div>
            </div>
            <div class="input-area">
                <input type="text" id="chatInput" placeholder="اكتب رسالتك..." onkeypress="handleEnter(event)">
                <button class="send-btn" onclick="sendMessage()">إرسال</button>
            </div>
        </div>
    </div>

    <!-- الشريط السفلي -->
    <div class="bottom-nav-bar">
        <button class="bottom-nav-item" onclick="alert('الإعدادات')">⚙️<span>خيارات</span></button>
        <button class="bottom-nav-item" onclick="alert('الأصدقاء')">👥<span>الأصدقاء</span></button>
        <button class="bottom-nav-item" onclick="alert('الغرف')">🏛️<span>الغرف</span></button>
        <button class="bottom-nav-item active" onclick="openProfileModal()">👤<span>الملف</span></button>
    </div>

    <!-- نافذة الملف الشخصي للمالك (مع ID1) -->
    <div id="profileModal" class="modal-overlay">
        <div class="profile-card">
            <button class="close-modal" onclick="document.getElementById('profileModal').style.display='none'">✕</button>
            <div class="profile-header-bg">
                <div class="owner-crown-title"><span>🏆 صاحب الموقع ✓</span></div>
                <div style="color: var(--gold); font-weight: bold; font-size: 16px; margin-top: 4px;">شيماء (Chaimaa)</div>
                <div style="font-size: 11px; color: #94a3b8;">www.arabi.chat</div>
            </div>
            <div class="profile-body">
                <div class="profile-info-row">
                    <span style="color: #94a3b8; font-size: 11px; display: block;">رابط الملف الشخصي (ID):</span>
                    <a href="https://arabi.chat/#id1" style="color: var(--gold); font-size: 12px;">https://arabi.chat/#id1</a>
                </div>
                <div class="admin-panel-box">
                    <b style="color: #ff3333; font-size: 12px; display: block;">⚙️ لوحة المالك (إعطاء رتب):</b>
                    <select id="selectedRank" style="width:100%; background:#071019; color:#fff; border:1px solid var(--border); padding:5px; border-radius:4px;">
                        <option value="Owner">Owner (مالك)</option>
                        <option value="Super Admin">Super Admin</option>
                        <option value="Admin">Admin</option>
                    </select>
                    <button onclick="alert('تم تفعيل الرتبة للمستخدم.')" style="width:100%; margin-top:5px; background:#10b981; border:none; color:white; padding:6px; border-radius:4px; font-weight:bold;">تأكيد منح الرتبة</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'public';
        function switchChatMode(mode) {
            currentMode = mode;
            document.getElementById('tabPublic').classList.toggle('active', mode === 'public');
            document.getElementById('tabPrivate').classList.toggle('active', mode === 'private');
        }
        function openProfileModal() { document.getElementById('profileModal').style.display = 'flex'; }
        function sendMessage() {
            const input = document.getElementById('chatInput');
            const box = document.getElementById('messagesBox');
            if(input.value.trim() !== "") {
                const row = document.createElement('div');
                row.className = currentMode === 'private' ? 'message-row private-msg' : 'message-row';
                row.innerHTML = `<div><span style="color:#ef4444; font-weight:bold;">👑 شيماء:</span> ${input.value}</div><button class="delete-btn" onclick="this.parentElement.remove()">حذف</button>`;
                box.appendChild(row);
                input.value = "";
            }
        }
        function handleEnter(e) { if(e.key === 'Enter') sendMessage(); }
    </script>
</body>
</html>
